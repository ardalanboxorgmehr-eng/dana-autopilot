<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reply Desk</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1c1c1a;--mute:#6b6a66;--line:#e3e1da;--acc:#2f6f5e;--acc2:#e7f1ed;--acc-ink:#fff;--warn:#a5482b;--warn2:#f8e9e3;--chip:#ecebe5;--yt:#c4302b;--hdr:rgba(244,243,239,.92)}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1d1d1b;--ink:#ecebe6;--mute:#9b9a94;--line:#2f2e2b;--acc:#5fb39b;--acc2:#1d302a;--acc-ink:#0e1a16;--warn:#e08a6c;--warn2:#35231d;--chip:#282825;--yt:#ff6b63;--hdr:rgba(18,18,17,.9)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1100px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.brand b{display:block;font-size:17px;line-height:1.1}
.status{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.st{font-size:12px;color:var(--mute);background:var(--chip);border-radius:20px;padding:1px 8px}
.st.ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:5px;vertical-align:1px}
.st.bad{color:var(--warn);background:var(--warn2)}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.warn{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
.nav{display:flex;align-items:center;gap:14px;padding:0 20px 10px;max-width:1100px;margin:0 auto;overflow-x:auto}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex:none}
.seg button{border:none;background:none;padding:4px 12px;border-radius:7px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:flex;gap:2px;flex:none}
.tab{border:none;background:none;padding:5px 10px;border-radius:8px;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--acc2);color:var(--acc);font-weight:600}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--chip);color:var(--mute);font-size:11px;font-weight:600;text-align:center}
.tab .n.hot{background:var(--warn);color:#fff}
.sep{width:1px;height:20px;background:var(--line);flex:none}
main{max-width:860px;margin:0 auto;padding:16px 20px 120px}
h2{font-size:15px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.top{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:13px;align-items:center}
.who{display:flex;gap:8px;align-items:center}
.who input{width:17px;height:17px;accent-color:var(--acc);margin:0}
.user{color:var(--ink);font-weight:600}
.cap{direction:rtl;text-align:right;color:var(--mute);font-size:13px;margin-top:4px}
.text{direction:rtl;text-align:right;font-size:17px;margin:8px 0 10px;white-space:pre-wrap}
textarea{width:100%;direction:rtl;text-align:right;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
textarea.ltr{direction:ltr;text-align:left;min-height:220px;font-size:14px}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--card);color:var(--ink)}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px}
.chip.spam,.chip.bad{color:var(--warn);background:var(--warn2)}
.chip.yt{color:var(--yt);font-weight:600}
.hint{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.bulk{position:sticky;top:118px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.bulk label{display:flex;gap:6px;align-items:center;font-weight:600}
.bulk input{width:17px;height:17px;accent-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stat b{font-size:22px;display:block}
.bar2{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--acc)}
.old{direction:rtl;text-align:right;color:var(--mute);text-decoration:line-through;font-size:14px}
.new{direction:rtl;text-align:right;font-size:15px;margin-top:4px}
.idea .n{font-size:22px;font-weight:700;color:var(--acc)}
.ex{direction:rtl;text-align:right;color:var(--mute);font-size:13px;margin:2px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:720px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .bd{padding:12px 18px;overflow:auto}
.sheet .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.rv{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.rv:last-child{border:none}
.rv .body{flex:1;min-width:0}
.rv .q{direction:rtl;text-align:right;color:var(--mute);font-size:13px}
.rv .a{direction:rtl;text-align:right;font-size:15px;white-space:pre-wrap;margin-top:3px}
.small .card{max-width:360px;text-align:center}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:8px;margin:10px 0}
.url{word-break:break-all;font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:6;display:none;max-width:90vw;white-space:pre-wrap}
@media (max-width:640px){.bar{padding:10px 12px}.nav{padding:0 12px 8px}main{padding:12px 12px 120px}.card{padding:12px}#phone,.status{display:none}.bulk{top:104px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">R</div>
    <div class="brand"><b>Reply Desk</b><div class="status" id="status"></div></div>
    <span class="grow"></span>
    <button id="phone" title="Open on iPhone">Phone</button>
    <button id="refresh" title="Pull the latest comments">Refresh</button>
    <button id="review" class="pri">Review &amp; send</button>
  </div>
  <div class="nav">
    <div class="seg" id="plat"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<main id="list"></main>
<div id="toast"></div>

<div class="modal" id="rmodal"><div class="sheet">
  <div class="hd"><b style="font-size:17px">Review before sending</b><span class="grow"></span><span class="hint" id="rcount"></span></div>
  <div class="bd" id="rbody"></div>
  <div class="ft"><span class="hint grow" id="rnote"></span><button id="rclose">Back</button><button class="pri" id="rsend">Send</button></div>
</div></div>

<div class="modal small" id="modal"><div class="card">
  <b id="mtitle">Open on your iPhone</b>
  <div class="hint" id="mhint">Same Wi-Fi as the Mac. Scan with the camera, then Share, Add to Home Screen.</div>
  <div id="qr"></div>
  <div class="url" id="purl"></div>
  <div class="acts" style="justify-content:center"><button onclick="$('#modal').classList.remove('on')">Close</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const GROUPS = {all:"All", wants_dm:"Wants the DM", question:"Questions", chat:"Chat", spam:"Spam"};
const VIEWS = {failed:"Failed DMs", inbox:"DMs", ideas:"Ideas", tiktok:"TikTok", weekly:"Weekly", learned:"Learned"};
const KINDS = {dm:"Send the post's DM", answer:"Threaded reply", thanks:"Threaded thanks", nudge:"Ask them to DM the keyword"};
const YT_KINDS = {answer:"Threaded reply", thanks:"Threaded thanks"};
const KIND_LABEL = {dm:"Post's DM", answer:"Reply", thanks:"Thanks", nudge:"DM us the keyword", inbox:"DM reply"};
let data = {items:[], badges:{}}, tab = "all", plat = "all", showLater = false, sel = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"X-Desk":"1","Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
}
let tt; function toast(msg, ms=3500){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(tt); tt=setTimeout(()=>t.style.display="none", ms); }
function ago(iso){
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(String(iso).replace("+0000","Z")))/60000);
  if (isNaN(m)) return "";
  return m < 60 ? m+" min ago" : m < 1440 ? Math.round(m/60)+" h ago" : Math.round(m/1440)+" d ago";
}
function header(counts){
  const st = [];
  st.push(`<span class="st ok">Instagram ${data.at?ago(data.at):"waiting"}</span>`);
  st.push(data.yt_connected ? `<span class="st ${data.yt_error?"bad":"ok"}">YouTube ${data.yt_error?"error":ago(data.yt_at)}</span>` : `<span class="st">YouTube off</span>`);
  if (data.queue_left) st.push(`<span class="st">${data.queue_left} posting</span>`);
  if (data.auto_on.length) st.push(`<span class="st ok">auto: ${data.auto_on.map(g=>GROUPS[g]).join(", ")}</span>`);
  $("#status").innerHTML = st.join("");
  $("#plat").innerHTML = ["all","ig","yt"].map(k => `<button class="${k===plat?"on":""}" data-p="${k}">${{all:"Both",ig:"Instagram",yt:"YouTube"}[k]}</button>`).join("");
  const b = data.badges || {};
  const badge = (n, hot) => n ? `<span class="n ${hot?"hot":""}">${n}</span>` : "";
  $("#tabs").innerHTML = Object.keys(GROUPS).map(k => `<button class="tab ${k===tab?"on":""}" data-g="${k}">${GROUPS[k]}${badge(counts[k]||0)}</button>`).join("")
    + `<span class="sep"></span>`
    + Object.keys(VIEWS).map(k => `<button class="tab ${k===tab?"on":""}" data-g="${k}">${VIEWS[k]}${k==="failed"?badge(b.failed,true):k==="inbox"?badge(b.inbox,true):""}</button>`).join("");
  $("#review").textContent = data.pending_push ? `Review & send (${data.pending_push})` : "Review & send";
  $("#review").disabled = !data.pending_push;
}
async function load(){
  data = await api("/api/items");
  const shown = data.items.filter(i => plat==="all" || i.platform===plat);
  const counts = {all:shown.length};
  shown.forEach(i => counts[i.group] = (counts[i.group]||0)+1);
  header(counts);
  if (tab === "learned") return renderLearned();
  if (tab === "ideas") return renderIdeas();
  if (tab === "inbox") return renderInbox();
  if (tab === "tiktok") return renderTiktok();
  if (tab === "weekly") return renderWeekly();
  if (tab === "failed") return renderFailed();
  render();
}
function bulkBar(n, total, actions){
  const all = n && n === total;
  return `<div class="bulk"><label><input type="checkbox" id="selall" ${all?"checked":""}> ${n?`${n} selected`:`Select all (${total})`}</label>
    <span class="grow"></span>${actions.map(a => `<button class="${a.cls||""}" data-bulk="${a.k}" ${n?"":"disabled"}>${a.t}</button>`).join("")}</div>`;
}
function render(){
  const list = data.items.filter(i => (tab==="all" || i.group===tab) && (plat==="all" || i.platform===plat));
  const ids = new Set(list.map(i=>i.id)); sel = new Set([...sel].filter(x => ids.has(x)));
  if (!list.length){ $("#list").innerHTML = `<div class="empty">Nothing waiting here.</div>`; return; }
  $("#list").innerHTML = bulkBar(sel.size, list.length, [{k:"approve",t:"Approve selected",cls:"pri"},{k:"skip",t:"Skip selected"}]) + list.map(i => {
    const kinds = i.platform==="yt" ? YT_KINDS : KINDS;
    return `
    <div class="card ${sel.has(i.id)?"sel":""}" data-id="${i.id}" data-draft="${esc(i.draft)}" data-kind="${i.kind}" data-group="${i.group}">
      <div class="top"><span class="who"><input type="checkbox" data-sel="${i.id}" ${sel.has(i.id)?"checked":""}>${i.platform==="yt"?'<span class="chip yt">YouTube</span>':""}<span class="user">${i.platform==="yt"?"":"@"}${esc(i.user)}</span> · ${ago(i.at)}${i.keyword?` · «${esc(i.keyword)}»`:""}</span>
        <span class="chip ${i.group}">${GROUPS[i.group]}</span></div>
      <div class="cap">${i.url?`<a href="${esc(i.url)}" target="_blank" style="color:inherit">${esc(i.caption)}</a>`:esc(i.caption)}</div>
      <div class="text">${esc(i.text)}</div>
      <textarea rows="${i.kind==="dm"?5:2}" placeholder="${i.group==="question"?"Write the answer, or wait for Claude's next drafting run":""}">${esc(i.draft)}</textarea>
      <div class="acts">
        <select>${Object.keys(kinds).map(k => `<option value="${k}" ${k===i.kind?"selected":""}>${kinds[k]}</option>`).join("")}</select>
        <button class="pri" data-a="ok">Approve</button>
        <button data-a="skip">Skip</button>
        ${i.has_claude_draft ? '<span class="hint">drafted by Claude</span>' : ""}
      </div>
    </div>`}).join("");
}
function cardPayload(card){
  return {id:card.dataset.id, kind:card.querySelector("select").value, text:card.querySelector("textarea").value.trim(),
          draft:card.dataset.draft, draft_kind:card.dataset.kind, group:card.dataset.group};
}
async function renderFailed(){
  const F = await api("/api/failed");
  const open = F.items.filter(i => showLater || !i.handled);
  const handled = F.items.filter(i => i.handled).length;
  const ids = new Set(open.map(i=>i.id)); sel = new Set([...sel].filter(x => ids.has(x)));
  let html = `<div class="hint" style="margin-bottom:10px">Keyword comments whose DM could not be sent.${F.retrying?` ${F.retrying} more are still being retried by the job.`:""}
    Instagram allows the DM only within 7 days of the comment. "Inbox does not take messages from pages" is the person's own setting, so a retry usually fails again; the public "DM us the keyword" reply is the fix there.</div>
    <div class="acts" style="margin-bottom:10px"><button data-later="1">${showLater?"Show only ones that need you":`Show all, incl. ${handled} already handled`}</button></div>`;
  if (!open.length){ $("#list").innerHTML = html + `<div class="empty">Nothing needs you here.</div>`; return; }
  html += bulkBar(sel.size, open.length, [{k:"f_dm",t:"Retry DM",cls:"pri"},{k:"f_nudge",t:"Reply: DM us"},{k:"f_dismiss",t:"Dismiss"}]);
  html += open.map(i => `<div class="card ${sel.has(i.id)?"sel":""}">
    <div class="top"><span class="who"><input type="checkbox" data-sel="${i.id}" ${sel.has(i.id)?"checked":""}><span class="user">@${esc(i.user)}</span> · ${ago(i.at)} · «${esc(i.keyword)}»</span><span class="chip bad">${esc(i.reason)}</span></div>
    <div class="cap">${esc(i.post)} · ${esc(i.title)}</div>
    ${i.text?`<div class="text" style="font-size:16px">${esc(i.text)}</div>`:""}
    <details><summary class="hint">DM they should get</summary><div class="cap" style="white-space:pre-wrap">${esc(i.message||"(no DM text found for this post)")}</div></details>
    <div class="acts">
      ${i.queued?'<span class="hint">Queued, waiting for Review &amp; send</span>':`
      ${i.can_dm?`<button class="pri" data-fa="dm" data-ids="${i.id}">Retry DM</button>`:'<span class="hint">Over 7 days, DM not allowed</span>'}
      ${i.bounced?'<span class="hint">"DM us the keyword" reply already left</span>':`<button data-fa="nudge" data-ids="${i.id}">Reply: DM us «${esc(i.keyword)}»</button>`}`}
      ${i.got_later?'<span class="hint">Got it later by DM</span>':""}
      <button data-fa="dismiss" data-ids="${i.id}">Dismiss</button>
    </div></div>`).join("");
  $("#list").innerHTML = html;
}
async function renderInbox(){
  const I = await api("/api/inbox");
  if (!I.connected){ $("#list").innerHTML = `<div class="card"><b>Answer Instagram DMs here</b><div class="hint" style="margin:6px 0 10px">Messages are locked with a private key that only this Mac and GitHub know, so they never sit readable in the public repo.</div><button class="pri" id="connectdm">Connect DMs</button></div>`; return; }
  if (I.waiting_for_job){ $("#list").innerHTML = `<div class="empty">Connected. The first DMs arrive after the next job run, within 15 minutes.</div>`; return; }
  if (!I.items.length){ $("#list").innerHTML = `<div class="empty">No DMs waiting. Read ${ago(I.at)}.</div>`; return; }
  $("#list").innerHTML = `<div class="hint" style="margin-bottom:10px">Instagram only allows a reply within 24 hours of their last message. Keyword DMs are answered by the job on its own.</div>` +
    I.items.map(i => `<div class="card" data-draft="${esc(i.draft)}">
      <div class="top"><span><span class="user">@${esc(i.user)}</span> · ${ago(i.at)}</span><span class="chip">DM</span></div>
      ${i.thread.map(m => `<div class="${m.me?"cap":"text"}" style="${m.me?"":"font-size:16px;margin:4px 0"}">${m.me?"You: ":""}${esc(m.text)}</div>`).join("")}
      <textarea rows="2" placeholder="Write the reply">${esc(i.draft)}</textarea>
      <div class="acts"><button class="pri" data-dm="${i.id}">Approve</button>${i.has_claude_draft?'<span class="hint">drafted by Claude</span>':""}</div></div>`).join("");
}
async function renderLearned(){
  const L = await api("/api/learned");
  const names = {wants_dm:"Wants the DM", question:"Questions", chat:"Chat", spam:"Spam or ads"};
  const cards = Object.keys(names).map(g => {
    const s = L.stats[g] || {approved:0, edited:0, streak:0};
    const can = L.auto_groups.includes(g), on = (L.auto[g]||{}).on;
    const pct = Math.min(100, Math.round(100*s.streak/L.unlock));
    let sw = "";
    if (can && on) sw = `<button data-auto="${g}" data-on="0">Turn auto-send off</button>`;
    else if (can && s.streak >= L.unlock) sw = `<button class="pri" data-auto="${g}" data-on="1">Turn auto-send on</button>`;
    else if (can) sw = `<div class="hint">Auto-send unlocks at ${L.unlock} unedited in a row</div><div class="bar2"><i style="width:${pct}%"></i></div>`;
    else sw = `<div class="hint">Always waits for you</div>`;
    return `<div class="card stat"><div class="hint">${names[g]}</div><b>${s.approved}</b>
      <div class="hint">approved · ${s.edited} edited · ${s.streak} in a row as drafted</div>${on?'<div class="hint" style="color:var(--acc)">Auto-send is on</div>':""}${sw}</div>`;
  }).join("");
  const edits = L.edits.length ? L.edits.map(e => `<div class="card">
      <div class="top"><span>${e.platform==="yt"?"YouTube":e.platform==="dm"?"DM":"Instagram"} · ${esc(e.user)} · ${ago(e.at)}</span><span class="chip">${names[e.group]||e.group}</span></div>
      <div class="text" style="font-size:15px">${esc(e.comment)}</div>
      <div class="old">${esc(e.draft)}</div><div class="new">${esc(e.final)}</div></div>`).join("")
    : `<div class="hint">No edits yet. Every time you change a draft before approving, it shows up here and Claude learns from it.</div>`;
  $("#list").innerHTML = `<div class="grid">${cards}</div>
    <h2>Style rules Claude follows</h2>
    <div class="hint">Claude adds to this after each drafting run, from your edits. Change or delete anything that is wrong, then Save.</div>
    <textarea class="ltr" id="style">${esc(L.style)}</textarea>
    <div class="acts"><button class="pri" id="savestyle">Save rules</button></div>
    <h2>Your thank-you lines (${L.total} approvals learned)</h2>
    <div class="text" style="font-size:15px">${L.thanks.map(esc).join("<br>")}</div>
    <h2>Recent edits</h2>${edits}`;
}
async function renderIdeas(){
  const I = await api("/api/ideas");
  if (!I.ideas || !I.ideas.length){ $("#list").innerHTML = `<div class="empty">No ideas yet. Claude fills this from the questions people ask, at each drafting run.</div>`; return; }
  $("#list").innerHTML = `<div class="hint" style="margin-bottom:10px">Questions people keep asking, most asked first. Updated ${ago(I.at)}.</div>` +
    I.ideas.map(d => `<div class="card idea"><div class="top"><span class="n">${d.count}×</span><span class="chip">${esc(d.status||"new")}</span></div>
      <div class="text" style="font-size:16px;font-weight:600">${esc(d.topic)}</div>
      ${(d.examples||[]).slice(0,3).map(x=>`<div class="ex">«${esc(x)}»</div>`).join("")}
      ${d.post?`<div class="new" style="margin-top:8px">💡 ${esc(d.post)}</div>`:""}
      <div class="acts">${d.status==="queued"?'<span class="hint">In the carousel queue</span>':`<button class="pri" data-idea="${esc(d.topic)}" data-post="${esc(d.post||"")}" data-count="${d.count||0}">Make it a carousel</button>`}</div></div>`).join("");
}
async function renderTiktok(){
  const T = await api("/api/tiktok");
  $("#list").innerHTML = `<div class="card"><b>TikTok @${esc(T.handle)}</b>
    <div class="hint" style="margin:6px 0 10px">TikTok does not let apps read or answer comments, so reply there. TikTok Studio shows every comment on one page.</div>
    <div class="acts"><a href="${T.studio}" target="_blank"><button class="pri">Open TikTok Studio comments</button></a><a href="${T.profile}" target="_blank"><button>Open profile</button></a></div></div>
    <h2>Recent posts</h2>` + T.posts.map(p => `<div class="card"><div class="top"><span>${esc(p.id)}</span></div><div class="text" style="font-size:15px">${esc(p.title)}</div></div>`).join("");
}
async function renderWeekly(){
  const W = await api("/api/weekly"), S = await api("/api/settings");
  const tile = (n,l) => `<div class="card stat"><b>${n}</b><div class="hint">${l}</div></div>`;
  $("#list").innerHTML = `<div class="hint" style="margin-bottom:10px">Last 7 days, since ${esc(W.since)}</div>
    <div class="grid">${tile(W.keyword_dms + W.keyword_dms_inbox,"keyword DMs sent")}${tile(W.replies_desk,"replies you approved")}${tile(W.replies_auto,"auto replies")}${tile(W.thanks_emoji,"emoji thank-yous")}${tile(W.dm_replies,"DM replies")}${tile(W.yt_replies,"YouTube replies")}${tile(W.edited_pct+"%","drafts you changed")}</div>
    ${W.summary?`<h2>Claude's note</h2><div class="card text" style="font-size:15px">${esc(W.summary)}</div>`:""}
    <h2>Posts that drove the most DMs</h2>${W.top_posts.length?W.top_posts.map(p=>`<div class="card"><div class="top"><span>${esc(p.post)}</span><b>${p.dms}</b></div><div class="cap">${esc(p.title)}</div></div>`).join(""):'<div class="hint">None this week.</div>'}
    <h2>Most asked</h2>${W.top_questions.length?W.top_questions.map(d=>`<div class="card"><div class="top"><span class="text" style="margin:0;font-size:15px">${esc(d.topic)}</span><b>${d.count}×</b></div></div>`).join(""):'<div class="hint">Fills after the first drafting run.</div>'}
    <h2>Phone alerts</h2><div class="card">${S.alerts_on?`<div class="hint">On. Alerts go to the ntfy app, subscribed to the link below.</div><div class="url">${esc(S.ntfy)}</div>`:`<div class="hint" style="margin-bottom:8px">Get a push when a question or DM has waited over 2 hours (never 23:00 to 08:00), when keyword DMs fail, and on Monday mornings.</div><button class="pri" id="alertson">Turn on phone alerts</button>`}</div>`;
}
async function openReview(){
  const P = await api("/api/pending");
  const rows = P.items.map(i => `<div class="rv" data-id="${i.id}">
    <div class="body"><div class="top"><span><span class="chip ${i.platform==="yt"?"yt":""}">${i.platform==="yt"?"YouTube":i.platform==="dm"?"DM":"Instagram"}</span> <span class="user">@${esc(i.user)}</span> · ${KIND_LABEL[i.kind]||i.kind}${i.retry?" (retry)":""}</span></div>
      ${i.comment?`<div class="q">«${esc(i.comment)}»</div>`:""}
      <div class="a">${esc(i.text)}</div></div>
    <button data-unapprove="${i.id}">Remove</button></div>`).join("");
  $("#rbody").innerHTML = (rows || '<div class="hint">No replies, only the changes below.</div>') + (P.other.length?`<h2>Also sent</h2>${P.other.map(o=>`<div class="hint">• ${esc(o)}</div>`).join("")}`:"");
  $("#rcount").textContent = `${P.items.length} repl${P.items.length===1?"y":"ies"}`;
  $("#rnote").textContent = "Remove anything that is wrong. Posting is spaced out, 12 every 15 minutes.";
  $("#rsend").textContent = `Send ${P.items.length || ""}`.trim();
  $("#rsend").disabled = !P.items.length && !P.other.length;
  $("#rmodal").classList.add("on");
}

/* ---------- events ---------- */
$("#plat").addEventListener("click", e => { if (e.target.dataset.p){ plat = e.target.dataset.p; if (VIEWS[tab]) tab="all"; sel.clear(); load(); } });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b){ tab = b.dataset.g; sel.clear(); load(); } });
function updateSel(){            // no re-render, so typed replies are kept
  const boxes = [...document.querySelectorAll("[data-sel]")];
  boxes.forEach(b => { b.checked = sel.has(b.dataset.sel); b.closest(".card").classList.toggle("sel", b.checked); });
  const all = $("#selall"); if (!all) return;
  all.checked = sel.size && sel.size === boxes.length;
  all.parentElement.lastChild.textContent = " " + (sel.size ? `${sel.size} selected` : `Select all (${boxes.length})`);
  document.querySelectorAll("[data-bulk]").forEach(b => b.disabled = !sel.size);
}
$("#list").addEventListener("change", e => {
  if (e.target.dataset.sel){ e.target.checked ? sel.add(e.target.dataset.sel) : sel.delete(e.target.dataset.sel); updateSel(); }
  if (e.target.id === "selall"){
    const boxes = [...document.querySelectorAll("[data-sel]")];
    if (e.target.checked) boxes.forEach(b => sel.add(b.dataset.sel)); else sel.clear();
    updateSel();
  }
});
$("#list").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.bulk){
    const ids = [...sel];
    if (t.dataset.bulk === "approve"){
      const cards = ids.map(id => document.querySelector(`.card[data-id="${CSS.escape(id)}"]`)).filter(Boolean);
      const items = cards.map(cardPayload).filter(x => x.text);
      const empty = cards.length - items.length;
      await api("/api/approve", {items});
      toast(`${items.length} approved${empty?`, ${empty} skipped because the reply is empty`:""}. Review & send when ready.`);
    } else if (t.dataset.bulk === "skip"){
      await api("/api/skip", {ids}); toast(`${ids.length} skipped.`);
    } else {
      const action = t.dataset.bulk.slice(2);
      const r = await api("/api/failed_action", {action, ids});
      toast(action==="dismiss" ? `${r.done} dismissed.` : `${r.done} queued${r.done<ids.length?`, ${ids.length-r.done} not possible (over 7 days or already replied)`:""}. Review & send when ready.`);
    }
    sel.clear(); return load();
  }
  if (t.dataset.later){ showLater = !showLater; return renderFailed(); }
  if (t.dataset.fa){
    const r = await api("/api/failed_action", {action:t.dataset.fa, ids:t.dataset.ids.split(",")});
    toast(t.dataset.fa==="dismiss" ? "Dismissed." : `${r.done} queued. Review & send when ready.`); return load();
  }
  if (t.dataset.idea !== undefined){
    const r = await api("/api/idea_queue", {topic:t.dataset.idea, post:t.dataset.post, count:+t.dataset.count});
    toast(r.ok ? "Added to the carousel queue. Send it with Review & send." : "Could not add it."); return load();
  }
  if (t.id === "connectdm"){ toast("Connecting..."); const r = await api("/api/connect_inbox", {}); toast(r.ok ? "Connected. DMs appear within 15 minutes." : "Could not connect:\n"+r.log, 6000); return load(); }
  if (t.dataset.dm){
    const card = t.closest(".card"); const text = card.querySelector("textarea").value.trim();
    if (!text){ card.querySelector("textarea").focus(); return; }
    await api("/api/inbox_send", {id:t.dataset.dm, text, draft:card.dataset.draft});
    toast("Approved. Review & send when ready."); return load();
  }
  if (t.id === "savestyle"){ await api("/api/style", {text:$("#style").value}); return toast("Rules saved."); }
  if (t.id === "alertson"){
    const r = await api("/api/alerts", {});
    if (!r.ok) return toast("Could not turn on alerts:\n"+r.log, 6000);
    showQR("Phone alerts", "Install the free ntfy app on your iPhone, then scan this code (or open the link) and subscribe.", r.url); return load();
  }
  if (t.dataset.auto){
    const on = t.dataset.on === "1";
    if (on && !confirm("Replies in this group will go out on their own from now on. You can turn it off here any time.")) return;
    const r = await api("/api/auto", {group:t.dataset.auto, on});
    toast(r.ok ? "Saved. Send it with Review & send." : r.log); return load();
  }
  const a = t.dataset.a; if (!a) return;
  const card = t.closest(".card");
  if (a === "skip"){ await api("/api/skip", {ids:[card.dataset.id]}); }
  else {
    const p = cardPayload(card);
    if (!p.text){ card.querySelector("textarea").focus(); return; }
    await api("/api/approve", {items:[p]});
  }
  sel.delete(card.dataset.id); load();
});
$("#rbody").addEventListener("click", async e => {
  const id = e.target.dataset.unapprove; if (!id) return;
  await api("/api/unapprove", {ids:[id]});
  e.target.closest(".rv").remove(); toast("Removed. It is back in the list."); load(); openReview();
});
$("#rclose").onclick = () => $("#rmodal").classList.remove("on");
$("#rsend").onclick = async () => {
  $("#rsend").disabled = true; $("#rsend").textContent = "Sending...";
  const r = await api("/api/push", {});
  $("#rmodal").classList.remove("on");
  toast(r.ok ? "Sent. The job posts them over the next runs, 12 every 15 minutes." : "Send failed:\n"+r.log, r.ok?4000:9000);
  load();
};
$("#review").onclick = openReview;
$("#refresh").onclick = async () => { toast("Pulling the latest..."); const r = await api("/api/refresh", {}); if (!r.ok) toast(r.log, 6000); load(); };
function showQR(title, hint, url){
  $("#mtitle").textContent = title; $("#mhint").textContent = hint;
  $("#qr").innerHTML = ""; $("#purl").textContent = url || "No Wi-Fi address found";
  if (url && window.QRCode) new QRCode($("#qr"), {text:url, width:220, height:220});
  $("#modal").classList.add("on");
}
$("#phone").onclick = async () => { const r = await api("/api/phone"); showQR("Open on your iPhone", "Same Wi-Fi as the Mac. Scan with the camera, then Share, Add to Home Screen.", r.url); };
load();
</script>
