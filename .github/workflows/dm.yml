name: comment-to-DM
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Override config for this run: dry_run or live"
        type: choice
        options: ["", "dry_run", "live"]
        default: ""
      keep_sweeping:
        description: "Stay alive and sweep every 15 min for 5.5 hours"
        type: boolean
        default: false
concurrency:
  group: dm
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  dm:
    runs-on: ubuntu-latest
    # A scheduled run stays alive and sweeps on its own clock, because GitHub's
    # cron mostly does not fire on this repo. 345 leaves the job room to finish
    # its last push inside GitHub's 6 hour ceiling.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep comments and send DMs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DM_MODE: ${{ inputs.mode }}
          DESK_KEY: ${{ secrets.DESK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 15 minutes keeps the Instagram read load identical to the old
          # four-runs-an-hour cron. 0 means one sweep and out.
          SWEEP_EVERY_MIN: ${{ (github.event_name == 'schedule' || inputs.keep_sweeping) && '15' || '0' }}
          SWEEP_BUDGET_MIN: "330"
        run: bash scripts/sweep.sh
