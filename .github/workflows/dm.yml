name: comment-to-DM
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Override config for this run: dry_run or live"
        type: choice
        options: ["", "dry_run", "live"]
        default: ""
concurrency:
  group: dm
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reply to comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DM_MODE: ${{ inputs.mode }}
        run: python scripts/dm_reply.py
      - name: YouTube comments
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/yt_comments.py
      - name: Record who was sent a DM
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/dm_sent.json state/yt_desk.json)" ]; then
            git config user.name "dana-autopilot"
            git config user.email "actions@github.com"
            git add state/dm_sent.json
            [ -f state/yt_desk.json ] && git add state/yt_desk.json
            git commit -m "dm: record sent messages"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "no new DMs"
          fi
